name: Bug report
description: Report reproducible incorrect behavior in LlamaManager
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact steps, selected llama.cpp build/model, and relevant paths/settings. Redact secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, command preview, exit status, hashes/build identifiers, or benchmark output where relevant.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, LlamaManager version/commit, llama.cpp build/backend, CPU/GPU/RAM, model architecture/quantization where relevant.
