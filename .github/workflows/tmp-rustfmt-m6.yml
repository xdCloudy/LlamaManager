name: Temporary M6 rustfmt

on:
  push:
    branches:
      - agent/m6-time-series-telemetry

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6-time-series-telemetry
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt
        shell: pwsh
        run: cargo fmt --all
      - name: Commit formatter output
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib.rs src/telemetry_history.rs
            git commit -m "style: apply rustfmt to telemetry history"
            git push origin HEAD:agent/m6-time-series-telemetry
          }
