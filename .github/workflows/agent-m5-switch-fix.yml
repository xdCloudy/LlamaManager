name: Agent M5 Switch Fix

on:
  push:
    branches:
      - agent/m5-switch-benchmark

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/m5-switch-benchmark

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply deterministic source fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/router_switch_benchmark.rs'
          $text = Get-Content -LiteralPath $path -Raw

          $text = $text.Replace('use serde_json::{Value, json};', 'use serde_json::json;')
          $text = $text.Replace('                    i64::from(run.succeeded()),', '                    (if run.succeeded() { 1_i64 } else { 0_i64 }),')

          foreach ($name in @('RouterSwitchLeg', 'RouterSwitchRecoveryEvidence', 'RouterSwitchBenchmarkRun')) {
            $pattern = '(?s)#\[derive\(Debug, Clone, PartialEq, Eq, Serialize, Deserialize\)\](\r?\n)pub struct ' + [regex]::Escape($name)
            $replacement = '#[derive(Debug, Clone, PartialEq, Serialize, Deserialize)]$1pub struct ' + $name
            $text = [regex]::Replace($text, $pattern, $replacement, 1)
          }

          Set-Content -LiteralPath $path -Value $text -Encoding utf8NoBOM
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git status --porcelain)) {
            Write-Host 'No source changes required.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/router_switch_benchmark.rs
          git commit -m 'fix(router): format and tighten switch benchmark types'
          git push origin HEAD:agent/m5-switch-benchmark
