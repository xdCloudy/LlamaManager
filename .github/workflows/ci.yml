name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Rust stable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Keep the CI workspace normalized while the initial source tranche is
      # being compiler-driven into shape. A dedicated format check is restored
      # once the first green source checkpoint is committed.
      - name: Format workspace
        run: cargo fmt --all

      - name: Check all targets
        run: cargo check --all-targets

      - name: Tests
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Release build
        run: cargo build --release
