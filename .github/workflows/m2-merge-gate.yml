name: M2 One-Shot Merge Gate

on:
  push:
    branches: [agent/m2-finalize]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  validate-and-merge:
    if: ${{ !contains(github.event.head_commit.message, '[merge-gate-cleanup]') }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m2-finalize
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Assert finalized product tree
        shell: pwsh
        run: |
          if (Test-Path ".github/workflows/m2-finalize-patch.yml") { throw "finalizer workflow still exists" }
          if (Test-Path ".github/workflows/agent-ui-patch.yml") { throw "temporary UI workflow still exists" }
          if (Test-Path ".github/workflows/agent-arm-ui.yml") { throw "temporary arm workflow still exists" }
          $app = Get-Content "src/app.rs" -Raw
          $store = Get-Content "src/model_store.rs" -Raw
          foreach ($needle in @("Section::Library", "ScanningLibrary", "MODEL LIBRARY", "scan_root", "manual_add_model")) {
            if (-not $app.Contains($needle)) { throw "app.rs missing finalized marker: $needle" }
          }
          foreach ($needle in @("conflicting_model_id", "same_path_changed_content_reassigns_location_without_losing_old_identity")) {
            if (-not $store.Contains($needle)) { throw "model_store.rs missing identity fix marker: $needle" }
          }

      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets
      - name: Tests
        run: cargo test --all-targets
      - name: Strict Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Release build
        run: cargo build --release

      - name: Remove merge gate and push clean product head
        shell: pwsh
        run: |
          Remove-Item ".github/workflows/m2-merge-gate.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore: remove one-shot M2 merge gate [merge-gate-cleanup]"
          git push origin HEAD:agent/m2-finalize

      - name: Wait for clean-head repository checks
        shell: pwsh
        run: gh pr checks 93 --watch --fail-fast

      - name: Merge clean M2 PR
        shell: pwsh
        run: |
          gh pr ready 93
          gh pr merge 93 --squash --delete-branch
