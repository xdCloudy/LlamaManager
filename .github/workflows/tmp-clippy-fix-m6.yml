name: Temporary M6 Clippy Fix

on:
  push:
    branches:
      - agent/m6-time-series-telemetry

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6-time-series-telemetry
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply machine-applicable Clippy fixes
        shell: pwsh
        run: |
          cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features -- -D warnings
          cargo fmt --all
      - name: Commit fixes
        shell: pwsh
        run: |
          if (git status --porcelain -- src/telemetry_history.rs) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/telemetry_history.rs
            git commit -m "fix(telemetry): satisfy strict Clippy"
            git push origin HEAD:agent/m6-time-series-telemetry
          }
