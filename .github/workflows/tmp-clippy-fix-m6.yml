name: Temporary M6 Clippy Fix

on:
  push:
    branches:
      - agent/m6-time-series-telemetry

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6-time-series-telemetry
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply exact Clippy fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src/telemetry_history.rs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              ('''        if let Some(previous) = self.samples.back() {
              if sample.timestamp_unix_ms < previous.timestamp_unix_ms {
                  return Err(HistoryError::OutOfOrderSample {
                      previous: previous.timestamp_unix_ms,
                      incoming: sample.timestamp_unix_ms,
                  });
              }
          }
          ''', '''        if let Some(previous) = self.samples.back()
              && sample.timestamp_unix_ms < previous.timestamp_unix_ms
          {
              return Err(HistoryError::OutOfOrderSample {
                  previous: previous.timestamp_unix_ms,
                  incoming: sample.timestamp_unix_ms,
              });
          }
          '''),
              ('''.filter_map(|sample| sample.state.render_class().and_then(|_| sample.value))''', '''.filter_map(|sample| sample.state.render_class().and(sample.value))'''),
              ('''                    if let (Some(previous), Some(limit)) =
                          (previous_renderable_timestamp, options.missing_gap_after_ms)
                      {
                          if sample.timestamp_unix_ms.saturating_sub(previous) > limit {
                              flush_segment(&mut current, &mut segments, options.width_px);
                              gaps.push(project_gap(
                                  ChartGapKind::MissingSamples,
                                  previous,
                                  sample.timestamp_unix_ms,
                                  "sample interval exceeded chart gap threshold",
                                  timeline_start,
                                  timeline_end,
                                  options.width_px,
                              ));
                          }
                      }
          ''', '''                    if let (Some(previous), Some(limit)) =
                          (previous_renderable_timestamp, options.missing_gap_after_ms)
                          && sample.timestamp_unix_ms.saturating_sub(previous) > limit
                      {
                          flush_segment(&mut current, &mut segments, options.width_px);
                          gaps.push(project_gap(
                              ChartGapKind::MissingSamples,
                              previous,
                              sample.timestamp_unix_ms,
                              "sample interval exceeded chart gap threshold",
                              timeline_start,
                              timeline_end,
                              options.width_px,
                          ));
                      }
          '''),
              ('''    if let Some((state, points)) = current.take() {
              if !points.is_empty() {
                  segments.push(ChartSegment {
                      state: state.into(),
                      points: decimate_for_pixels(points, width_px),
                  });
              }
          }
          ''', '''    if let Some((state, points)) = current.take()
              && !points.is_empty()
          {
              segments.push(ChartSegment {
                  state: state.into(),
                  points: decimate_for_pixels(points, width_px),
              });
          }
          '''),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected Clippy target not found:\n{old}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          '@ | python -
          cargo fmt --all
      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/telemetry_history.rs
          git commit -m "fix(telemetry): satisfy strict Clippy"
          git push origin HEAD:agent/m6-time-series-telemetry
