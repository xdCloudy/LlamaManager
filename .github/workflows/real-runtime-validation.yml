name: Real Windows Runtime Validation

on:
  pull_request:
    paths:
      - ".github/workflows/real-runtime-validation.yml"
      - "tests/real_runtime_validation.rs"
      - "tests/real_hardware_telemetry.rs"
      - "tests/real_inference_telemetry.rs"
      - "tests/real_telemetry_overhead.rs"
      - "tests/real_server_readiness.rs"
      - "tests/real_router_discovery.rs"
      - "tests/real_router_operations.rs"
      - "tests/real_router_switch_benchmark.rs"
      - "tests/real_router_management.rs"
      - "src/benchmark.rs"
      - "src/gguf.rs"
      - "src/gpu_telemetry.rs"
      - "src/hardware_telemetry.rs"
      - "src/inference_telemetry.rs"
      - "src/inference_telemetry_ui.rs"
      - "src/streaming_inference_probe.rs"
      - "src/llama.rs"
      - "src/persistence.rs"
      - "src/router.rs"
      - "src/router_management_ui.rs"
      - "src/router_observability.rs"
      - "src/router_operations.rs"
      - "src/router_switch_benchmark.rs"
      - "src/server_command.rs"
      - "src/server_process.rs"
      - "src/server_readiness.rs"
      - "src/telemetry_alerts.rs"
      - "src/telemetry_history.rs"
      - "src/telemetry_overhead.rs"
      - "src/telemetry_ui.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-runtime:
    name: Real Windows hardware + llama.cpp + GGUF + benchmark + server + router
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      LLAMA_RELEASE_TAG: b10472
      LLAMA_ARCHIVE_URL: https://github.com/ggml-org/llama.cpp/releases/download/b10472/llama-b10472-bin-win-cpu-x64.zip
      MODEL_URL: https://huggingface.co/ggml-org/tiny-llamas/resolve/6e091d820cbe8f22eeb604d136403eca290b8c1e/stories15M-q4_0.gguf?download=true
      MODEL_SHA256: 6151b1929d7f5aa3385d9ddef3393e55587c0a55de661562322bc51dfda93a04
      MODEL_V2_URL: https://huggingface.co/Aryanne/TinyLlama-1.1B-step-480K-1007B-gguf/resolve/9500b01dfc1684b0b9ab9ef064eec3099f497fe2/q2_k-tinyllama-1.1b-1t.gguf?download=true
      MODEL_V2_SHA256: 18e8af33a3f4a4ce87314adbdb16757160c6ad93aee2a8ee7aae2a6350d1cfd7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Download pinned upstream llama.cpp and published GGUFs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'external llama cpp 外部 build'
          $modelRoot = Join-Path $env:RUNNER_TEMP 'Models with spaces 模型'
          $benchModelRoot = Join-Path $env:RUNNER_TEMP 'Benchmark Models with spaces'
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\real-runtime'
          $archive = Join-Path $env:RUNNER_TEMP 'llama-win-cpu.zip'
          $model = Join-Path $modelRoot 'stories 15M v3 模型.gguf'
          $modelV2 = Join-Path $modelRoot 'TinyLlama v2 模型.gguf'
          $benchModel = Join-Path $benchModelRoot 'stories 15M benchmark.gguf'

          New-Item -ItemType Directory -Force -Path $runtimeRoot, $modelRoot, $benchModelRoot, $evidenceRoot | Out-Null

          Invoke-WebRequest -Uri $env:LLAMA_ARCHIVE_URL -OutFile $archive
          $archiveSha = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Expand-Archive -Path $archive -DestinationPath $runtimeRoot -Force

          Invoke-WebRequest -Uri $env:MODEL_URL -OutFile $model
          $modelSha = (Get-FileHash -Path $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($modelSha -ne $env:MODEL_SHA256) {
            throw "Published GGUF SHA-256 mismatch. Expected $env:MODEL_SHA256, got $modelSha"
          }
          Copy-Item -LiteralPath $model -Destination $benchModel
          $benchModelSha = (Get-FileHash -Path $benchModel -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($benchModelSha -ne $modelSha) {
            throw "Benchmark GGUF copy identity mismatch. Expected $modelSha, got $benchModelSha"
          }

          Invoke-WebRequest -Uri $env:MODEL_V2_URL -OutFile $modelV2
          $modelV2Sha = (Get-FileHash -Path $modelV2 -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($modelV2Sha -ne $env:MODEL_V2_SHA256) {
            throw "Published GGUF v2 SHA-256 mismatch. Expected $env:MODEL_V2_SHA256, got $modelV2Sha"
          }

          $server = Get-ChildItem -Path $runtimeRoot -Filter llama-server.exe -File -Recurse | Select-Object -First 1
          $bench = Get-ChildItem -Path $runtimeRoot -Filter llama-bench.exe -File -Recurse | Select-Object -First 1
          if (-not $server -or -not $bench) {
            throw 'Pinned llama.cpp archive does not contain llama-server.exe and llama-bench.exe'
          }

          "LLAMAMANAGER_REAL_LLAMA_ROOT=$runtimeRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLAMAMANAGER_REAL_MODEL=$model" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLAMAMANAGER_REAL_MODEL_SHA256=$modelSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLAMAMANAGER_REAL_MODEL_V2=$modelV2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLAMAMANAGER_REAL_MODEL_V2_SHA256=$modelV2Sha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLAMAMANAGER_REAL_BENCH_MODEL=$benchModel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLAMAMANAGER_REAL_EVIDENCE_DIR=$evidenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLAMAMANAGER_LLAMA_RELEASE_TAG=$env:LLAMA_RELEASE_TAG" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LLAMAMANAGER_LLAMA_ARCHIVE_SHA256=$archiveSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          [ordered]@{
            llama_release_tag = $env:LLAMA_RELEASE_TAG
            llama_archive_url = $env:LLAMA_ARCHIVE_URL
            llama_archive_sha256 = $archiveSha
            model_v3_url = $env:MODEL_URL
            model_v3_sha256 = $modelSha
            model_v3_unicode_path = $model
            benchmark_model_sha256 = $benchModelSha
            benchmark_model_spaces_path = $benchModel
            model_v2_url = $env:MODEL_V2_URL
            model_v2_sha256 = $modelV2Sha
            model_v2_unicode_path = $modelV2
            runtime_root = $runtimeRoot
            server_path = $server.FullName
            bench_path = $bench.FullName
            windows = [System.Environment]::OSVersion.VersionString
          } | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $evidenceRoot 'download-identities.json') -Encoding utf8

      - name: Strict source gates
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --all-targets --all-features -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run real Windows hardware telemetry validation
        shell: pwsh
        run: cargo test --test real_hardware_telemetry -- --ignored --nocapture

      - name: Cross-check hardware telemetry against independent Windows system view
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $telemetryPath = Join-Path $env:LLAMAMANAGER_REAL_EVIDENCE_DIR 'hardware-telemetry.json'
          if (-not (Test-Path -LiteralPath $telemetryPath)) {
            throw "hardware telemetry evidence was not produced: $telemetryPath"
          }

          $telemetry = Get-Content -LiteralPath $telemetryPath -Raw | ConvertFrom-Json -Depth 20
          if ($telemetry.cpu.logical_processor_count.state.state -ne 'live' -or
              $telemetry.cpu.physical_core_count.state.state -ne 'live' -or
              $telemetry.memory.total_physical_bytes.state.state -ne 'live') {
            throw 'hardware telemetry did not expose live topology and total-memory evidence'
          }

          $processors = @(Get-CimInstance -ClassName Win32_Processor)
          $os = Get-CimInstance -ClassName Win32_OperatingSystem
          $cimLogical = [uint64](($processors | Measure-Object -Property NumberOfLogicalProcessors -Sum).Sum)
          $cimPhysical = [uint64](($processors | Measure-Object -Property NumberOfCores -Sum).Sum)
          $cimTotalBytes = [uint64]$os.TotalVisibleMemorySize * 1KB
          $providerLogical = [uint64]$telemetry.cpu.logical_processor_count.state.value
          $providerPhysical = [uint64]$telemetry.cpu.physical_core_count.state.value
          $providerTotalBytes = [uint64]$telemetry.memory.total_physical_bytes.state.value

          if ($providerLogical -ne $cimLogical) {
            throw "logical processor mismatch: provider=$providerLogical CIM=$cimLogical"
          }
          if ($providerPhysical -ne $cimPhysical) {
            throw "physical core mismatch: provider=$providerPhysical CIM=$cimPhysical"
          }

          $totalDelta = if ($providerTotalBytes -ge $cimTotalBytes) {
            $providerTotalBytes - $cimTotalBytes
          } else {
            $cimTotalBytes - $providerTotalBytes
          }
          $totalTolerance = [uint64][Math]::Max(256MB, [double]$providerTotalBytes * 0.05)
          if ($totalDelta -gt $totalTolerance) {
            throw "total physical memory mismatch exceeds tolerance: provider=$providerTotalBytes CIM=$cimTotalBytes delta=$totalDelta tolerance=$totalTolerance"
          }

          [ordered]@{
            provider = [ordered]@{
              logical_processors = $providerLogical
              physical_cores = $providerPhysical
              total_physical_bytes = $providerTotalBytes
            }
            independent_cim = [ordered]@{
              logical_processors = $cimLogical
              physical_cores = $cimPhysical
              total_visible_memory_bytes = $cimTotalBytes
              free_physical_memory_bytes = [uint64]$os.FreePhysicalMemory * 1KB
            }
            total_memory_delta_bytes = $totalDelta
            total_memory_tolerance_bytes = $totalTolerance
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:LLAMAMANAGER_REAL_EVIDENCE_DIR 'hardware-telemetry-independent.json') -Encoding utf8

      - name: Run real telemetry overhead validation
        shell: pwsh
        run: cargo test --test real_telemetry_overhead -- --ignored --nocapture

      - name: Run real Windows runtime validation
        shell: pwsh
        run: cargo test --test real_runtime_validation -- --ignored --nocapture

      - name: Run real llama-server readiness and inference validation
        shell: pwsh
        run: cargo test --test real_server_readiness -- --ignored --nocapture

      - name: Run real streaming inference telemetry validation
        shell: pwsh
        run: cargo test --test real_inference_telemetry -- --ignored --nocapture

      - name: Run real llama-server router discovery validation
        shell: pwsh
        run: cargo test --test real_router_discovery -- --ignored --nocapture

      - name: Run real llama-server router operation validation
        shell: pwsh
        run: cargo test --test real_router_operations -- --ignored --nocapture

      - name: Run real llama-server A-B-A switch benchmark validation
        shell: pwsh
        run: cargo test --test real_router_switch_benchmark -- --ignored --nocapture

      - name: Run real router management restart reconciliation validation
        shell: pwsh
        run: cargo test --test real_router_management -- --ignored --nocapture

      - name: Show evidence summary
        if: always()
        shell: pwsh
        run: |
          $hardware = 'artifacts\real-runtime\hardware-telemetry.json'
          if (Test-Path $hardware) { Get-Content $hardware }
          $hardwareIndependent = 'artifacts\real-runtime\hardware-telemetry-independent.json'
          if (Test-Path $hardwareIndependent) { Get-Content $hardwareIndependent }
          $overhead = 'artifacts\real-runtime\telemetry-overhead.json'
          if (Test-Path $overhead) { Get-Content $overhead }
          $inference = 'artifacts\real-runtime\inference-telemetry.json'
          if (Test-Path $inference) { Get-Content $inference }
          $summary = 'artifacts\real-runtime\summary.json'
          if (Test-Path $summary) { Get-Content $summary }
          $readiness = 'artifacts\real-runtime\server-readiness-inference.json'
          if (Test-Path $readiness) { Get-Content $readiness }
          $router = 'artifacts\real-runtime\router-discovery.json'
          if (Test-Path $router) { Get-Content $router }
          $routerOperations = 'artifacts\real-runtime\router-operations.json'
          if (Test-Path $routerOperations) { Get-Content $routerOperations }
          $routerSwitchBenchmark = 'artifacts\real-runtime\router-switch-benchmark.json'
          if (Test-Path $routerSwitchBenchmark) { Get-Content $routerSwitchBenchmark }
          $routerManagement = 'artifacts\real-runtime\router-management.json'
          if (Test-Path $routerManagement) { Get-Content $routerManagement }

      - name: Upload real runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-windows-runtime-evidence
          path: artifacts/real-runtime/
          if-no-files-found: error
          retention-days: 30
