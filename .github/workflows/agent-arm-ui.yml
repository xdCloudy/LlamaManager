name: Arm Agent M2 UI Patch

on:
  push:
    branches: [agent/m2-model-library-compatibility]

permissions:
  contents: write

jobs:
  arm:
    if: ${{ !contains(github.event.head_commit.message, '[arm-done]') && !contains(github.event.head_commit.message, '[ui-patched]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m2-model-library-compatibility
          fetch-depth: 0
      - name: Convert UI patch to push-triggered one-shot
        shell: pwsh
        run: |
          $path = ".github/workflows/agent-ui-patch.yml"
          $s = Get-Content $path -Raw
          $s = $s.Replace("on:`n  pull_request:`n    branches: [main]", "on:`n  push:`n    branches: [agent/m2-model-library-compatibility]")
          $s = $s.Replace("jobs:`n  patch-validate:`n    runs-on:", "jobs:`n  patch-validate:`n    if: `${{ !contains(github.event.head_commit.message, '[ui-patched]') }}`n    runs-on:")
          Set-Content -Path $path -Value $s -Encoding utf8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          git commit -m "ci(agent): arm M2 UI patch [arm-done]"
          git push origin HEAD:agent/m2-model-library-compatibility
