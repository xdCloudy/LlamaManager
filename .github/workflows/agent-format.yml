name: Agent M2 Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  reconstruct-validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m2-model-library-compatibility
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Reconstruct staged agent files
        shell: pwsh
        run: |
          $manifestPath = ".agent_chunks\manifest.json"
          if (-not (Test-Path $manifestPath)) {
            throw "agent staging manifest is missing"
          }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          foreach ($entry in $manifest.files) {
            $encoded = ""
            Get-ChildItem ".agent_chunks\$($entry.prefix).*" | Sort-Object Name | ForEach-Object {
              $encoded += (Get-Content $_.FullName -Raw).Trim()
            }
            $bytes = [Convert]::FromBase64String($encoded)
            $target = Join-Path $PWD $entry.target
            New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
            [IO.File]::WriteAllBytes($target, $bytes)
          }
          Remove-Item ".agent_chunks" -Recurse -Force
      - name: Format
        run: cargo fmt --all
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Release build
        run: cargo build --release
      - name: Commit reconstructed source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat(m2): reconstruct validated model-library source [agent-format]"
          git push origin HEAD:agent/m2-model-library-compatibility
