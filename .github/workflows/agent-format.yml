name: Agent Rustfmt

on:
  push:
    branches: [agent/m2-model-library-compatibility]

permissions:
  contents: write

jobs:
  rustfmt:
    if: ${{ !contains(github.event.head_commit.message, '[agent-format]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m2-model-library-compatibility
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and commit
        shell: pwsh
        run: |
          cargo fmt --all
          if (-not (git diff --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m "chore: rustfmt agent changes [agent-format]"
            git push origin HEAD:agent/m2-model-library-compatibility
          }
