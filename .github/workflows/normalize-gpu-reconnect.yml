name: Normalize NVML reconnect patch

on:
  push:
    branches:
      - agent/m6-gpu-telemetry

permissions:
  contents: write

jobs:
  normalize:
    # Created first, then triggered so GitHub executes the branch-local workflow.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6-gpu-telemetry
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Restore canonical source and apply reconnect patch
        shell: pwsh
        run: |
          $path = 'src/gpu_telemetry.rs'
          git show 214105dc095ea935812f6eca5c914ecab2221479:$path | Out-File -LiteralPath $path -Encoding utf8NoBOM
          $text = (Get-Content -LiteralPath $path -Raw).Replace("`r`n", "`n")
          $old = @'
    impl GpuBackend for NvmlBackend {
        fn sample_adapters(&mut self) -> Result<BackendSnapshot, BackendProviderError> {
            self.library()?.sample_adapters()
        }
    }
'@.Replace("`r`n", "`n")
          $new = @'
    impl GpuBackend for NvmlBackend {
        fn sample_adapters(&mut self) -> Result<BackendSnapshot, BackendProviderError> {
            let result = self.library()?.sample_adapters();
            if result.is_err() {
                self.library = None;
            }
            result
        }
    }
'@.Replace("`r`n", "`n")
          if (-not $text.Contains($old)) { throw 'reconnect anchor not found' }
          $text = $text.Replace($old, $new)
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          cargo fmt --all
          cargo check --all-targets

      - name: Commit canonical source
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gpu_telemetry.rs
          if (-not (git diff --cached --quiet)) {
            git commit -m 'fix(telemetry): canonicalize NVML reconnect patch'
            git push origin HEAD:agent/m6-gpu-telemetry
          }
