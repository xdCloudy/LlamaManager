name: One-shot artifact cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-old-artifacts.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Actions artifacts older than 3 days
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          cutoff=$(date -u -d '3 days ago' +%s)
          deleted=0
          reclaimed=0

          while IFS=$'\t' read -r id created name size; do
            [[ -z "${id:-}" ]] && continue
            created_epoch=$(date -u -d "$created" +%s)

            if (( created_epoch < cutoff )); then
              echo "Deleting artifact $id ($name, $size bytes, created $created)"
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
              deleted=$((deleted + 1))
              reclaimed=$((reclaimed + size))
            fi
          done < <(
            gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id, .created_at, .name, .size_in_bytes] | @tsv'
          )

          echo "Deleted $deleted artifacts"
          echo "Reclaimed approximately $reclaimed bytes of currently retained artifact storage"
          {
            echo "## Artifact cleanup"
            echo "Deleted: $deleted artifacts"
            echo "Approx bytes removed: $reclaimed"
          } >> "$GITHUB_STEP_SUMMARY"
