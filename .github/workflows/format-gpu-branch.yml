name: Format GPU telemetry branch

on:
  push:
    branches:
      - agent/m6-gpu-telemetry

permissions:
  contents: write

jobs:
  rustfmt:
    # Temporary branch-only formatter; removed after it commits canonical rustfmt output.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m6-gpu-telemetry

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply rustfmt
        shell: pwsh
        run: cargo fmt --all

      - name: Commit formatter output
        shell: pwsh
        run: |
          if (-not (git status --porcelain)) {
            Write-Host 'No formatting changes required.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/gpu_telemetry.rs src/lib.rs
          git commit -m 'style: apply rustfmt to GPU telemetry'
          git push origin HEAD:agent/m6-gpu-telemetry
