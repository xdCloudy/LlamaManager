name: Format router UI branch

on:
  pull_request:
    branches: [main]
    paths:
      - "src/router_management_ui.rs"
      - "tests/real_router_management.rs"
      - ".github/workflows/real-runtime-validation.yml"
      - ".github/workflows/router-ui-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/m5-router-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m5-router-ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Remove one-shot workflow
        run: rm .github/workflows/router-ui-format.yml
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/router_management_ui.rs tests/real_router_management.rs .github/workflows/router-ui-format.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(router): format real management validation"
          git push origin HEAD:agent/m5-router-ui
