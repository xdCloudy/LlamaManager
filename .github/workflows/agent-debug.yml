name: Agent Compile Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  capture-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m2-model-library-compatibility
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture cargo check output
        shell: pwsh
        run: |
          cargo check --all-targets *>&1 | Tee-Object -FilePath agent-check.log
          $checkExit = $LASTEXITCODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent-check.log
          if (-not (git diff --cached --quiet)) {
            git commit -m "ci: capture agent compile diagnostics [skip ci]"
            git push origin HEAD:agent/m2-model-library-compatibility
          }
          exit 0
